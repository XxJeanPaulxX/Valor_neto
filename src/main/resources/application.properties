spring.application.name=valor-neto
server.port=8080

# ---- Reglas de negocio (punto 4 de la pizarra) ----
# El descuento solo se aplica si el sueldo es mayor o igual a este monto (S/ 1200 no, S/ 2500 si)
reglas.sueldo-minimo-descuento=2000
# 8% de descuento
reglas.porcentaje-descuento=8
# Mas de 8 horas -> bonificacion
reglas.horas-limite=8
reglas.bonificacion-horas-extras=300
